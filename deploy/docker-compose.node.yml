# One node on ANOTHER machine, joining a control plane that runs somewhere else (deploy/README.md, "多台真机"; docs/en/multi-machine.md).
# Use deploy/node.sh rather than calling this directly: it writes node.env (the variables below plus the node's bearer token) and starts it.
x-node-image: &node_image ${NODE_IMAGE:-fc-node:dev}

services:
  fc-node:
    image: *node_image
    hostname: ${NODE_NAME:?set NODE_NAME in node.env}
    entrypoint: ["/usr/bin/python3", "/usr/local/bin/nodeagent.py"]
    env_file: ["${NODE_ENV_FILE:-./node.env}"]            # NODE_TOKEN: the bearer the control plane uses to call this node
    devices: ["/dev/kvm", "/dev/net/tun", "/dev/vhost-vsock", "/dev/fuse"]
    cap_add: [NET_ADMIN, SYS_ADMIN, SYS_PTRACE, SYS_NICE]
    security_opt: ["apparmor=unconfined", "seccomp=unconfined"]
    cgroup: private
    sysctls: {net.ipv4.ip_forward: 1}
    stop_grace_period: 120s
    environment:
      NODE_NAME: ${NODE_NAME}
      TEMPLATES_DIR: /work/templates
      MAX_VMS: ${MAX_VMS:-32}
      MEM_BUDGET_MIB: ${MEM_BUDGET_MIB:-8192}
      TLS_CERT: ${NODE_TLS_CERT:-}
      TLS_KEY: ${NODE_TLS_KEY:-}
      FENCE_AFTER_S: ${FENCE_AFTER_S:-0}
      HOST_VCPUS: ${HOST_VCPUS:-16}
      JAIL: ${JAIL:-1}
      LAZY_STORE: ${STORE_URL:?set STORE_URL in node.env}      # the control plane side's chunk store, e.g. http://10.0.0.1:18900 (private network only: it has no authentication)
      STORE: ${STORE_URL}
      DEFAULT_TEMPLATE: ${DEFAULT_TEMPLATE:-debian-13}
      REGISTRY_MIRROR: ${REGISTRY_MIRROR:-https://registry-1.docker.io}
      TEMPLATE_POOL: ${TEMPLATE_POOL:-[]}
    volumes:
      - "${REPO_DIR:-..}/images:/work/images:ro"
      - "${REPO_DIR:-..}/recipes/templates:/work/templates:ro"
      - "${DATA_DIR:-.}/state:/var/lib/fc-node"
    ports: ["${BIND_IP:?set BIND_IP in node.env}:${NODE_PORT:-8800}:8800"]       # this machine's private IP; never 0.0.0.0 on a public interface
    restart: unless-stopped
