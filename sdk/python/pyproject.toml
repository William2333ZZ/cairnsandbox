[project]
name = "cairnbox"
version = "0.1.0"
description = "Python SDK for the Cairn sandbox cloud: sandboxes, commands, files, PTY, ports, checkpoints, volumes, budgets, billing"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
cairnbox-mcp = "cairnbox.mcp:main"
cairn = "cairnbox.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cairnbox*"]
