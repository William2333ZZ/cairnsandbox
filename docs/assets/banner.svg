<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="Cairn: a sandbox where agents can go back">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#14263A"/></linearGradient>
    <linearGradient id="s1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5EEAD4"/><stop offset="1" stop-color="#14B8A6"/></linearGradient>
    <linearGradient id="s2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#99A8BD"/><stop offset="1" stop-color="#64748B"/></linearGradient>
    <linearGradient id="s3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#CBD5E1"/><stop offset="1" stop-color="#94A3B8"/></linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#1E3A52"/></pattern>
  </defs>
  <rect width="1280" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="18" fill="url(#dots)" opacity=".7"/>
  <g transform="translate(110 40) scale(2.0)">
    <ellipse cx="60" cy="104" rx="46" ry="11" fill="#334155"/>
    <ellipse cx="60" cy="102" rx="46" ry="11" fill="url(#s2)"/>
    <ellipse cx="64" cy="78" rx="34" ry="9.5" fill="#475569"/>
    <ellipse cx="64" cy="76" rx="34" ry="9.5" fill="url(#s3)"/>
    <ellipse cx="57" cy="55" rx="25" ry="8" fill="#0F766E"/>
    <ellipse cx="57" cy="53" rx="25" ry="8" fill="url(#s1)"/>
    <ellipse cx="60" cy="35" rx="15" ry="6.5" fill="#64748B"/>
    <ellipse cx="60" cy="33" rx="15" ry="6.5" fill="url(#s3)"/>
    <circle cx="60" cy="19" r="5.5" fill="#F59E0B"/>
  </g>
  <text x="420" y="152" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="92" font-weight="700" fill="#F8FAFC" letter-spacing="-2">Cairn</text>
  <text x="424" y="204" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="30" fill="#5EEAD4">A sandbox where agents can go back.</text>
  <text x="424" y="246" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" fill="#94A3B8">microVMs with checkpoints, rollback and fork</text>
  <text x="424" y="276" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" fill="#94A3B8">egress that needs a yes · an audit trail you can verify</text>
</svg>
