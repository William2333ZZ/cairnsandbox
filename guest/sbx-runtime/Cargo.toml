[package]
name = "sbx-runtime"
version = "0.1.0"
edition = "2021"
description = "Guest-side sandbox daemon (L1): vsock NDJSON protocol, exec/sessions/files/pack/time/net/freeze. Rust port of node/guest/sandboxd.py, protocol-identical."

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
